apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fashionhub-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  tls:
    - hosts:
        - staging.fashionhub.yourdomain.com
      secretName: fashionhub-tls-staging
  rules:
    - host: staging.fashionhub.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fashionhub-backend-service
                port:
                  number: 80
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: fashionhub-backend-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fashionhub-frontend-service
                port:
                  number: 80
