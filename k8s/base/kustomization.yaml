apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: fashionhub-base

resources:
  - ../manifests/namespaces/fashionhub-namespace.yaml
  - ../manifests/secrets/fashionhub-secrets.yaml
  - ../manifests/configmaps/fashionhub-configmap.yaml
  - ../manifests/deployments/fashionhub-deployment.yaml
  - ../manifests/services/fashionhub-services.yaml
  - ../manifests/ingress/fashionhub-ingress.yaml
  - ../manifests/storage/fashionhub-persistent-volumes.yaml
  - ../manifests/autoscaling/fashionhub-hpa.yaml
  - ../manifests/security/fashionhub-network-policy.yaml

commonLabels:
  app: fashionhub
  version: v1.0.0
  managed-by: kustomize
