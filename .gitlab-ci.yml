# GitLab CI/CD Pipeline: Validate, Build, Tag, Clean
stages:
  - validate
  - build
  - cleanup

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"

# Validate stage: simple structure check
validate:
  stage: validate
  image: node:18-alpine
  script:
    - echo "🔍 Validating project structure..."
    - test -f package.json && echo "✅ package.json exists" || echo "❌ package.json missing"
  only:
    - branches
    - tags

# Build stage: create Docker image and tag
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "🏗️ Building Docker image..."
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
    - echo "✅ Docker image built and pushed with tag $CI_COMMIT_REF_NAME"
  only:
    - branches
    - tags

# Cleanup stage: optional image cleanup
cleanup:
  stage: cleanup
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "🧹 Cleaning up Docker images..."
    - docker image prune -f
    - echo "✅ Cleanup completed"
  when: always
