# GitLab CI/CD Pipeline for FashionHub Online Store
# This pipeline handles building, testing, and deploying both frontend and backend services

stages:
  - validate
  - test
  - build
  - deploy

variables:
  # Docker configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  
  # Node.js version
  NODE_VERSION: "18"
  
  # Database URLs for testing
  DATABASE_URL: "postgresql://test_user:test_password@postgres:5432/test_db"
  REDIS_URL: "redis://:test_password@redis:6379"

# Cache dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/node_modules/
    - frontend/node_modules/
    - .npm/

# Validate stage - Check code quality and dependencies
validate:backend:
  stage: validate
  image: node:${NODE_VERSION}-alpine
  services:
    - postgres:15-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    REDIS_PASSWORD: test_password
  before_script:
    - cd backend
    - npm install --omit=dev
    - npx prisma generate
  script:
    - echo "🔍 Validating backend dependencies..."
    - npm audit --audit-level=moderate || true
    - echo "📋 Checking Prisma schema..."
    - npx prisma validate
    - echo "✅ Backend validation completed"
  only:
    - merge_requests
    - main
    - develop
    - tags

validate:frontend:
  stage: validate
  image: node:${NODE_VERSION}-alpine
  before_script:
    - cd frontend
    - npm install --omit=dev
  script:
    - echo "🔍 Validating frontend dependencies..."
    - npm audit --audit-level=moderate || true
    - echo "📋 Checking TypeScript configuration..."
    - npx tsc --noEmit
    - echo "✅ Frontend validation completed"
  only:
    - merge_requests
    - main
    - develop
    - tags

# Test stage - Run unit and integration tests
test:backend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - postgres:15-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    REDIS_PASSWORD: test_password
    NODE_ENV: test
    JWT_SECRET: test_jwt_secret
    JWT_REFRESH_SECRET: test_refresh_secret
  before_script:
    - cd backend
    - npm install
    - npx prisma generate
    - npx prisma migrate deploy
    - npx prisma db seed
  script:
    - echo "🧪 Running backend tests..."
    - npm test
    - echo "✅ Backend tests completed"
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    paths:
      - backend/coverage/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop
    - tags

test:frontend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - cd frontend
    - npm install
  script:
    - echo "🧪 Running frontend tests..."
    - npm run test:ci || echo "No tests configured yet"
    - echo "✅ Frontend tests completed"
  artifacts:
    paths:
      - frontend/coverage/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop
    - tags

# Build stage - Build Docker images
build:backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "🏗️ Building backend Docker image..."
    - cd backend
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest .
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    - echo "✅ Backend image built and pushed"
  only:
    - main
    - develop
    - tags

build:frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "🏗️ Building frontend Docker image..."
    - cd frontend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest .
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
    - echo "✅ Frontend image built and pushed"
  only:
    - main
    - develop
    - tags

# Deploy stage - Deploy to environments
deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$STAGING_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "🚀 Deploying to staging environment..."
    - ssh $STAGING_SSH_USER@$STAGING_SSH_HOST "
        cd $STAGING_DEPLOY_PATH &&
        docker-compose pull &&
        docker-compose up -d &&
        docker system prune -f
      "
    - echo "✅ Staging deployment completed"
  environment:
    name: staging
    url: $STAGING_URL
  only:
    - develop

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$PRODUCTION_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "🚀 Deploying to production environment..."
    - ssh $PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST "
        cd $PRODUCTION_DEPLOY_PATH &&
        docker-compose pull &&
        docker-compose up -d &&
        docker system prune -f
      "
    - echo "✅ Production deployment completed"
  environment:
    name: production
    url: $PRODUCTION_URL
  when: manual
  only:
    - main
    - tags

# Security scanning
security:scan:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm install -g npm-audit-resolver
  script:
    - echo "🔒 Running security scans..."
    - cd backend && npm audit --audit-level=moderate || true
    - cd ../frontend && npm audit --audit-level=moderate || true
    - echo "✅ Security scan completed"
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop
    - tags

# Documentation generation
docs:generate:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - cd backend
    - npm install --omit=dev
  script:
    - echo "📚 Generating API documentation..."
    - npm run docs:generate || echo "No documentation script configured"
    - echo "✅ Documentation generation completed"
  artifacts:
    paths:
      - backend/docs/
    expire_in: 1 month
  only:
    - main
    - tags

# Performance testing
performance:test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm install -g artillery
  script:
    - echo "⚡ Running performance tests..."
    - cd backend
    - artillery run performance-tests.yml || echo "No performance tests configured"
    - echo "✅ Performance tests completed"
  artifacts:
    paths:
      - backend/performance-reports/
    expire_in: 1 week
  allow_failure: true
  only:
    - main
    - tags

# Cleanup stage
cleanup:
  stage: .post
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "🧹 Cleaning up Docker images..."
    - docker image prune -f
    - echo "✅ Cleanup completed"
  when: always
  allow_failure: true
